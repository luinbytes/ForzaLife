[package]
name = "forzalife"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native ForzaLife port for Forza Horizon 6 on Linux"

[dependencies]
ctrlc = "3.4"
egui = { version = "0.33", features = ["default_fonts"] }
egui-wgpu = "0.33"
evdev = "0.13"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
pollster = "0.4"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = "0.20"
wayland-backend = { version = "0.3", features = ["client_system", "rwh_06"] }
wayland-client = "0.31"
x11rb = { version = "0.13", features = ["xinput"] }

[profile.release]
lto = "thin"
strip = true
